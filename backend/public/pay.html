<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Buy with MSG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.js"></script>
    <style>
      :root{--bg:#070b10;--panel:#0e1620;--panel2:#0b121a;--border:#1b2a3b;--text:#e8f1ff;--muted:#9fb3c8;--accent:#1B5A72;--accent2:#2b7b9a;--radius:16px}
      *{box-sizing:border-box}
      body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
      .container{max-width:1040px;margin:36px auto;padding:20px}
      .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
      .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
      @media (max-width:860px){.wrap{grid-template-columns:1fr}}
      .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
      .media{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--border)}
      .media img{width:100%;display:block}
      .skeleton{position:absolute;inset:0;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.07),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      h2{margin:0 0 6px 0;font-size:22px}
      .price{font-size:18px;margin:2px 0 12px;color:#bfe6ff}
      .row{display:flex;gap:10px;align-items:center;margin:12px 0}
      .muted{color:var(--muted);opacity:.9}
      .small{font-size:12px}
      .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);margin:14px 0}
      button{appearance:none;border:1px solid transparent;background:transparent;color:var(--text);padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.18s ease}
      .btn{background:linear-gradient(180deg,var(--accent2),var(--accent));border:1px solid rgba(255,255,255,.08)}
      .btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
      .btn.ghost{background:transparent;border:1px solid #223246;color:#d2e9ff}
      button[disabled]{opacity:.6;cursor:not-allowed}
      .address{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:6px 10px;border:1px dashed #223246;border-radius:10px;color:#cfe6ff}
      .log{white-space:pre-wrap;background:#0c131a;padding:12px;border-radius:12px;border:1px solid var(--border);min-height:56px}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 style="margin:0">MSG Checkout</h1>
        <div class="muted small">Solana • Mainnet</div>
      </div>

      <div class="wrap">
        <div class="card">
          <figure class="media">
            <!-- no default src -->
            <img id="img" alt="Item" loading="lazy"/>
            <div class="skeleton" id="imgSkel"></div>
          </figure>
        </div>

        <div class="card">
          <h2 id="label">Item</h2>
          <div class="price">
            <span id="amount">1</span> MSG
            <span id="qtyNote" class="muted small"></span>
          </div>

          <div class="row">
            <button class="btn" id="connectBtn">Connect Wallet</button>
            <span class="address" id="wallet"></span>
          </div>
          <div class="row">
            <button class="btn ghost" id="previewBtn" disabled>Preview (no charge)</button>
            <button class="btn" id="buyBtn" disabled>Buy with MSG</button>
          </div>

          <div class="divider"></div>
          <div class="muted small">
            <div>Item ID: <span id="itemId">item-001</span></div>
            <div>Merchant receives MSG on-chain. You pay network fee in SOL.</div>
          </div>

          <div class="divider"></div>
          <div class="log" id="log"></div>
        </div>
      </div>
    </div>

    <script>
      // ---------- helpers ----------
      const apiBase = `${location.protocol}//${location.host}`;
      const imgEl = document.getElementById('img');
      const imgSkel = document.getElementById('imgSkel');
      imgEl.addEventListener('load', ()=> imgSkel.style.display='none');
      imgEl.addEventListener('error', ()=> imgSkel.style.display='none');

      // convert wix:image://v1/... → https://static.wixstatic.com/media/...
      function toPublicImageURL(src){
        if (!src) return '';
        if (/^https?:\/\//i.test(src) || src.startsWith('/')) return src;
        const m = src.match(/^wix:image:\/\/v1\/([^\/#?]+)/);
        return m ? `https://static.wixstatic.com/media/${m[1]}` : src;
      }

      // ---------- params ----------
      const qs = new URLSearchParams(location.search);
      const pid   = qs.get('pid');      // shortlink hydration id
      let   label = qs.get('label') || 'Item';
      let   itemId= qs.get('itemId') || '';
      let   img   = qs.get('img') || '';
      let   qty   = Number(qs.get('qty') || '1');
      if (!Number.isFinite(qty) || qty < 1) qty = 1;

      // amountStr: if provided, it's a TOTAL already; if missing and pid is present, we'll compute from unit*qty
      let amountStr = qs.get('amount') || '';

      // ---------- hydrate from /products/:pid if needed ----------
      async function hydrateFromPidIfNeeded(){
        if (!pid) return;
        try{
          const r = await fetch(`${apiBase}/products/${encodeURIComponent(pid)}`);
          if (!r.ok) throw new Error('product lookup failed');
          const data = await r.json(); // { itemId, label, amount (unit), img }
          if (!itemId) itemId = data.itemId || pid;
          if (!label || label === 'Item') label = data.label || label;
          if (!img) img = data.img || img;
          if (!amountStr) {
            const unit = Number(data.amount || 1);
            const total = Math.max(1, Math.round(unit * qty));
            amountStr = String(total);
          }
        }catch(e){
          // fallback
          if (!itemId) itemId = pid;
        }
      }

      (async () => {
        await hydrateFromPidIfNeeded();

        if (!itemId) itemId = 'item-001';
        if (!amountStr) amountStr = '1';

        // fill UI
        document.getElementById('label').textContent  = label;
        document.getElementById('itemId').textContent = itemId;
        const totalNum = Number(amountStr);
        document.getElementById('amount').textContent = Number.isFinite(totalNum) ? totalNum.toLocaleString() : amountStr;

        const qtyNoteEl = document.getElementById('qtyNote');
        if (qty > 1) {
          const unit = Number.isFinite(totalNum) ? totalNum / qty : 0;
          qtyNoteEl.textContent = ` • Qty: ${qty}${unit ? ' @ ' + Math.round(unit).toLocaleString() + ' MSG ea' : ''}`;
        }

        if (img) {
          imgEl.src = toPublicImageURL(img);
        } else {
          imgSkel.style.display='none';
        }
      })();

      // ---------- wallet + actions ----------
      const connectBtn = document.getElementById('connectBtn');
      const previewBtn = document.getElementById('previewBtn');
      const buyBtn = document.getElementById('buyBtn');
      const walletSpan = document.getElementById('wallet');
      const logDiv = document.getElementById('log');

      let provider = null;
      let pubkey = null;

      function log(msg){ logDiv.textContent = `${msg}\n` + logDiv.textContent; }
      function getProvider(){
        if ('solana' in window) { const p = window.solana; return p?.isPhantom ? p : p; }
        alert('No Solana wallet found. Install Phantom or open in a wallet browser.'); return null;
      }

      connectBtn.onclick = async () => {
        provider = getProvider(); if (!provider) return;
        try {
          const res = await provider.connect();
          pubkey = res.publicKey ?? provider.publicKey;
          walletSpan.textContent = pubkey?.toBase58()?.slice(0,4)+'…'+pubkey?.toBase58()?.slice(-4);
          previewBtn.disabled = false; buyBtn.disabled = false;
          log('Wallet connected.');
        } catch { log('Connect cancelled.'); }
      };

      async function requestTx({ test }){
        const url = new URL(apiBase + '/actions/pay');
        url.searchParams.set('amount', amountStr);                // TOTAL MSG (qty applied upstream)
        url.searchParams.set('itemId', itemId || 'item');
        if (test) url.searchParams.set('test', 'true');

        const body = { account: pubkey.toBase58() };
        const resp = await fetch(url.toString(), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(()=>({}));
          throw new Error(err.error || 'Failed to build tx');
        }
        return resp.json();
      }

      // recentBlockhash hydration + v0 support
      async function signAndSend(base64){
        const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        let tx;
        try {
          tx = solanaWeb3.Transaction.from(bytes);
        } catch {
          const v0 = solanaWeb3.VersionedTransaction.deserialize(bytes);
          const res = await provider.signAndSendTransaction(v0);
          return res.signature;
        }
        if (!tx.feePayer) tx.feePayer = pubkey;
        if (!tx.recentBlockhash || tx.recentBlockhash.length === 0){
          const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com', 'confirmed');
          const { blockhash } = await connection.getLatestBlockhash('finalized');
          tx.recentBlockhash = blockhash;
        }
        const res = await provider.signAndSendTransaction(tx);
        return res.signature;
      }

      previewBtn.onclick = async () => {
        if (!provider || !pubkey) return alert('Connect wallet first');
        try {
          log('Building preview transaction…');
          const { transaction, message } = await requestTx({ test:true });
          log(message);
          const sig = await signAndSend(transaction);
          log(`Preview sent (memo-only). Signature: ${sig}\nhttps://explorer.solana.com/tx/${sig}?cluster=mainnet-beta`);
        } catch (e) { log(`Preview failed: ${e.message || e}`); }
      };

      buyBtn.onclick = async () => {
        if (!provider || !pubkey) return alert('Connect wallet first');
        try {
          log('Building purchase transaction…');
          const { transaction, message } = await requestTx({ test:false });
          log(message);
          const sig = await signAndSend(transaction);
          log(`Purchase submitted. Signature: ${sig}\nhttps://explorer.solana.com/tx/${sig}?cluster=mainnet-beta`);
        } catch (e) { log(`Purchase failed: ${e.message || e}`); }
      };
    </script>
  </body>
</html>
