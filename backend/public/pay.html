<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Buy with MSG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- web3.js via CDN -->
    <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.js"></script>
    <style>
      :root{
        --bg:#070b10;
        --bg-grad: radial-gradient(1200px 600px at 20% -10%, #0e2130 0%, transparent 60%),
                   radial-gradient(900px 600px at 100% 10%, #0b2340 0%, transparent 50%);
        --panel:#0e1620;
        --panel-2:#0b121a;
        --border:#1b2a3b;
        --muted:#9fb3c8;
        --text:#e8f1ff;
        --accent:#1B5A72;      /* your brand midnight blue */
        --accent-2:#2b7b9a;
        --accent-3:#369dc2;
        --success:#3ddc97;
        --warn:#f6c177;
        --shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02);
        --radius:16px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
        background: var(--bg);
        color:var(--text);
        background-image: var(--bg-grad);
        background-attachment: fixed;
      }

      .container{max-width:1100px;margin:36px auto;padding:20px}
      .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
      .brand{display:flex;gap:10px;align-items:center}
      .logo{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent-3),var(--accent));box-shadow:0 0 24px var(--accent-3)}
      .brand h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.3px;opacity:.95}
      .network{font-size:12px;color:var(--muted);opacity:.9}

      .wrap{
        display:grid;
        grid-template-columns: 1.1fr .9fr;
        gap:24px;
      }
      @media (max-width: 860px){
        .wrap{grid-template-columns:1fr}
      }

      .card{
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border:1px solid var(--border);
        border-radius:var(--radius);
        padding:18px;
        box-shadow: var(--shadow);
      }

      /* media panel */
      .media{display:block; position:relative; overflow:hidden; border-radius:14px; border:1px solid var(--border)}
      .media img{width:100%; height:auto; display:block}
      .skeleton{
        position:absolute; inset:0; border-radius:14px;
        background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.07), rgba(255,255,255,.04));
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
      }
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

      /* content panel */
      h2{margin:0 0 6px 0;font-size:22px;letter-spacing:.2px}
      .price{font-size:18px;margin:2px 0 12px;color:#bfe6ff}
      .badge{
        display:inline-flex;align-items:center;gap:6px;
        font-size:12px;color:#d9f3ff;background:rgba(27,90,114,.16);
        border:1px solid rgba(27,90,114,.45); padding:6px 10px; border-radius:999px;
      }
      .row{display:flex;gap:10px;align-items:center;margin:12px 0}
      .row.stack{flex-direction:column; align-items:stretch}
      .muted{color:var(--muted);opacity:.9}
      .small{font-size:12px}
      .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);margin:14px 0}

      button{
        appearance:none; border:1px solid transparent; background:transparent; color:var(--text);
        padding:12px 16px; border-radius:12px; cursor:pointer; font-weight:600; transition:.18s ease;
      }
      .btn{
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
        border-color: rgba(255,255,255,.08);
        box-shadow: 0 6px 20px rgba(27,90,114,.35);
      }
      .btn:hover{filter:brightness(1.05)}
      .btn:active{transform:translateY(1px)}
      .btn.secondary{
        background: linear-gradient(180deg, #142130, #0f1a26);
        border-color:#223246;
      }
      button[disabled]{opacity:.6; cursor:not-allowed; filter:grayscale(.2)}
      .ghost{
        background:transparent;border:1px solid #223246;color:#d2e9ff;
      }

      .address{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; padding:6px 10px; border:1px dashed #223246; border-radius:10px; color:#cfe6ff}

      /* log + toasts */
      .log{
        white-space: pre-wrap; background:#0c131a; padding:12px; border-radius:12px; border:1px solid var(--border);
        min-height:56px;
      }
      .toasts{position:fixed;right:14px;top:14px;display:flex;flex-direction:column;gap:10px;z-index:50}
      .toast{background:#0f1824;border:1px solid #223246;color:#d7ecff;padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);font-size:13px}
      .toast.ok{border-color:rgba(61,220,151,.35)}
      .toast.err{border-color:rgba(255,98,98,.35)}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      a{color:#9ad6ff}
    </style>
  </head>
  <body>
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

    <div class="container">
      <div class="header">
        <div class="brand">
          <span class="logo"></span>
          <h1>MSG Marketplace</h1>
        </div>
        <div class="network">Solana • Mainnet</div>
      </div>

      <div class="wrap">
        <!-- Left: Media -->
        <div class="card">
          <figure class="media">
            <img id="img" src="/cars/1963_CCC2.png" alt="1963 Chevrolet Corvette C2" loading="lazy"/>
            <div class="skeleton" id="imgSkel"></div>
          </figure>
        </div>

        <!-- Right: Content -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <h2 id="label">1963 Chevrolet Corvette C2</h2>
            <span class="badge" id="statusBadge">Not connected</span>
          </div>
          <div class="price"><span id="amount">1</span> MSG</div>

          <div class="row">
            <button class="btn secondary" id="connectBtn">
              <!-- wallet icon -->
              Connect Wallet
            </button>
            <span class="address" id="wallet"></span>
          </div>

          <div class="row">
            <button class="btn ghost" id="previewBtn" disabled>Preview (no charge)</button>
            <button class="btn" id="buyBtn" disabled>Buy with MSG</button>
          </div>

          <div class="divider"></div>

          <div class="muted small">
            <div>Item ID: <span id="itemId">item-001</span></div>
            <div>Merchant receives MSG on-chain. You pay network fee in SOL.</div>
          </div>

          <div class="divider"></div>
          <div class="log" id="log" aria-live="polite" aria-atomic="true"></div>
          <span class="sr-only" id="sr"></span>
        </div>
      </div>
    </div>

    <script>
      // ======= Utilities / UI =======
      const toasts = document.getElementById('toasts');
      function toast(msg, type='ok'){
        const el = document.createElement('div');
        el.className = 'toast ' + (type === 'err' ? 'err' : 'ok');
        el.textContent = msg;
        toasts.appendChild(el);
        setTimeout(()=> el.remove(), 3600);
      }
      const sr = document.getElementById('sr');
      function announce(msg){ sr.textContent = msg; }

      function shortPk(pk){
        if(!pk) return '';
        const s = pk.toBase58 ? pk.toBase58() : String(pk);
        return s.slice(0,4) + '…' + s.slice(-4);
      }

      // skeleton off when image loads
      const imgEl = document.getElementById('img');
      const imgSkel = document.getElementById('imgSkel');
      imgEl.addEventListener('load', ()=> imgSkel.style.display='none');
      imgEl.addEventListener('error', ()=> { imgSkel.style.display='none'; toast('Image failed to load','err'); });

      // ======= Query params =======
      const qs = new URLSearchParams(location.search);
      const label = qs.get('label') || 'Item';
      const amount = qs.get('amount') || '500';
      const itemId = qs.get('itemId') || 'item-001';
      const img = qs.get('img') || ''; // full URL or /path under /public
      const apiBase = `${location.protocol}//${location.host}`;

      document.getElementById('label').textContent = label;
      document.getElementById('amount').textContent = Number(amount).toLocaleString();
      document.getElementById('itemId').textContent = itemId;
      if (img) imgEl.src = img.startsWith('/') || /^https?:/i.test(img) ? img : '/' + img;

      // ======= Wallet wiring =======
      const connectBtn = document.getElementById('connectBtn');
      const previewBtn = document.getElementById('previewBtn');
      const buyBtn = document.getElementById('buyBtn');
      const walletSpan = document.getElementById('wallet');
      const logDiv = document.getElementById('log');
      const statusBadge = document.getElementById('statusBadge');

      let provider = null;
      let pubkey = null;
      let busy = false;

      function setBusy(v){
        busy = v;
        previewBtn.disabled = v || !pubkey;
        buyBtn.disabled = v || !pubkey;
        connectBtn.disabled = v;
        if(v){ toast('Hold on…','ok'); }
      }

      function log(msg){ logDiv.textContent = `${msg}\n` + logDiv.textContent; announce(msg); }

      function getProvider() {
        if ('solana' in window) {
          const anyProv = window.solana;
          return anyProv?.isPhantom ? anyProv : anyProv;
        }
        alert('No Solana wallet found. Install Phantom or open in a wallet browser.');
        return null;
      }

      connectBtn.onclick = async () => {
        provider = getProvider();
        if (!provider) return;
        try {
          const res = await provider.connect();
          pubkey = res.publicKey ?? provider.publicKey;
          walletSpan.textContent = shortPk(pubkey);
          statusBadge.textContent = 'Connected';
          statusBadge.style.background = 'rgba(61,220,151,.16)';
          statusBadge.style.borderColor = 'rgba(61,220,151,.45)';
          previewBtn.disabled = false;
          buyBtn.disabled = false;
          toast('Wallet connected');
          log('Wallet connected.');
        } catch (e) {
          console.error(e);
          toast('Connect cancelled','err');
          log('Connect cancelled.');
        }
      };

      async function requestTx({ test }) {
        const url = new URL(apiBase + '/actions/pay');
        url.searchParams.set('amount', amount);
        url.searchParams.set('itemId', itemId);
        if (test) url.searchParams.set('test', 'true');

        const body = { account: pubkey.toBase58() };
        const resp = await fetch(url.toString(), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to build tx');
        }
        return resp.json();
      }

      // --------- Important hydration patch (recentBlockhash) ----------
      async function signAndSend(base64) {
        // 1) Decode
        const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

        // 2) Try legacy Transaction first; fall back to VersionedTransaction
        let tx;
        try {
          tx = solanaWeb3.Transaction.from(bytes);
        } catch {
          // Some wallets/servers may return a v0 transaction
          tx = solanaWeb3.VersionedTransaction.deserialize(bytes);
          const res = await provider.signAndSendTransaction(tx);
          return res.signature;
        }

        // 3) HYDRATE: ensure feePayer and recentBlockhash exist
        if (!tx.feePayer) tx.feePayer = pubkey;
        if (!tx.recentBlockhash || tx.recentBlockhash.length === 0) {
          const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com', 'confirmed');
          const { blockhash } = await connection.getLatestBlockhash('finalized');
          tx.recentBlockhash = blockhash;
        }

        // 4) Sign & send
        const res = await provider.signAndSendTransaction(tx);
        return res.signature;
      }

      previewBtn.onclick = async () => {
        if (!provider || !pubkey) return alert('Connect wallet first');
        setBusy(true);
        try {
          log('Building preview transaction…');
          const { transaction, message } = await requestTx({ test: true });
          log(message);
          const sig = await signAndSend(transaction);
          toast('Preview sent (memo-only)');
          log(`Preview sent (memo-only). Signature: ${sig}\nhttps://explorer.solana.com/tx/${sig}?cluster=mainnet-beta`);
        } catch (e) {
          console.error(e);
          toast(e.message || 'Preview failed','err');
          log(`Preview failed: ${e.message || e}`);
        } finally {
          setBusy(false);
        }
      };

      buyBtn.onclick = async () => {
        if (!provider || !pubkey) return alert('Connect wallet first');
        setBusy(true);
        try {
          log('Building purchase transaction…');
          const { transaction, message } = await requestTx({ test: false });
          log(message);
          const sig = await signAndSend(transaction);
          toast('Purchase submitted');
          log(`Purchase submitted. Signature: ${sig}\nhttps://explorer.solana.com/tx/${sig}?cluster=mainnet-beta`);
        } catch (e) {
          console.error(e);
          toast(e.message || 'Purchase failed','err');
          log(`Purchase failed: ${e.message || e}`);
        } finally {
          setBusy(false);
        }
      };
    </script>
  </body>
</html>
